<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Universo Arbell V3</title><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Nunito',sans-serif}body{background:linear-gradient(135deg,#a8c0ff,#c2b6ff,#e8d5ff,#b8c6ff);background-attachment:fixed;min-height:100vh;padding-bottom:90px;color:#2d2a4a}header{background:rgba(255,255,255,.85);backdrop-filter:blur(12px);padding:18px 16px 12px;text-align:center;position:sticky;top:0;z-index:50}header h1{font-size:1.7rem;font-weight:800}.main-tabs{display:flex;gap:8px;justify-content:center;margin:14px 12px;flex-wrap:wrap}.tab-btn{padding:10px 18px;border-radius:999px;border:2px solid #fff;background:rgba(255,255,255,.7);font-weight:700;cursor:pointer}.tab-btn.active{background:#2d2a4a;color:#fff}.sub-tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 12px}.sub-btn{white-space:nowrap;padding:8px 14px;border-radius:999px;border:1.5px solid rgba(45,42,74,.15);background:rgba(255,255,255,.8);font-weight:600;font-size:.85rem;cursor:pointer}.sub-btn.active{background:#2d2a4a;color:#fff}.container{padding:0 14px}.card-form{background:rgba(255,255,255,.88);border-radius:22px;padding:16px;box-shadow:0 8px 24px rgba(139,115,255,.18);margin-bottom:16px}.upload-area{border:2px dashed #a99bff;border-radius:16px;padding:16px;text-align:center;cursor:pointer}.upload-area img{width:100%;max-height:200px;object-fit:cover;border-radius:12px;display:none}.upload-area.has-img{padding:0}.upload-area.has-img img{display:block}.input{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid rgba(45,42,74,.12);background:rgba(255,255,255,.9);font-size:.95rem;outline:none}.row{display:flex;gap:10px}.row>*{flex:1}label{font-size:.8rem;font-weight:700;opacity:.7;margin:10px 0 4px;display:block}.btn-primary{width:100%;padding:13px;border-radius:14px;border:none;background:linear-gradient(135deg,#6d5bff,#9b8cff);color:#fff;font-weight:800;cursor:pointer;margin-top:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item-card{background:rgba(255,255,255,.92);border-radius:18px;overflow:hidden;box-shadow:0 6px 18px rgba(45,42,74,.12);position:relative;cursor:pointer}.item-card img{width:100%;height:165px;object-fit:cover}.item-info{padding:10px 11px}.item-info h4{font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-info p{font-size:.75rem;opacity:.6}.badge{position:absolute;top:8px;left:8px;background:rgba(45,42,74,.85);color:#fff;font-size:.65rem;padding:4px 8px;border-radius:999px;font-weight:700}.progress-bar{height:4px;background:rgba(0,0,0,.08);border-radius:999px;margin-top:6px;overflow:hidden}.progress-fill{height:100%;background:linear-gradient(90deg,#6d5bff,#a99bff)}.shelf-title{font-size:1.1rem;font-weight:800;margin:22px 0 10px 2px;background:rgba(255,255,255,.8);display:inline-block;padding:6px 14px;border-radius:999px}.modal{position:fixed;inset:0;background:rgba(20,16,40,.55);backdrop-filter:blur(8px);z-index:100;display:none;align-items:end;justify-content:center}.modal.show{display:flex}.modal-box{background:#fff;width:100%;max-width:500px;border-radius:28px 28px 0 0;max-height:88vh;overflow-y:auto}.modal-cover{width:100%;height:280px;object-fit:cover}.modal-content{padding:18px}.modal-actions{display:flex;gap:10px;margin-top:16px}.btn-danger{flex:1;padding:12px;border-radius:12px;border:1.5px solid #ff6b8a;color:#ff3b6a;background:rgba(255,59,106,.08);font-weight:700;cursor:pointer}.btn-move{flex:1;padding:12px;border-radius:12px;border:none;background:#2d2a4a;color:#fff;font-weight:700;cursor:pointer}.profile-card{background:rgba(255,255,255,.9);border-radius:22px;padding:20px;text-align:center}.avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#a8c0ff,#c2b6ff);margin:0 auto 12px;display:block;border:3px solid #fff}.stats{display:flex;gap:10px;margin-top:14px}.stat{flex:1;background:rgba(109,91,255,.1);padding:12px;border-radius:16px}.stat b{font-size:1.4rem;display:block}.bottom-nav{position:fixed;bottom:12px;left:12px;right:12px;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-radius:24px;display:flex;justify-content:space-around;padding:8px;box-shadow:0 10px 30px rgba(45,42,74,.2);z-index:60}.nav-btn{flex:1;padding:10px 4px;border:none;background:none;border-radius:16px;font-weight:700;font-size:.75rem;cursor:pointer;color:#6b6788}.nav-btn.active{background:#2d2a4a;color:#fff}.hidden{display:none!important}.small{font-size:.8rem;opacity:.7}</style></head><body><header><div>💙💜</div><h1>Universo Arbell</h1><p id="headerSub">Club Namjoon's • Libros & Dramas</p></header><div id="view-biblioteca"><div class="sub-tabs" id="bookTabs"><button class="sub-btn active" data-status="leidos">Leídos</button><button class="sub-btn" data-status="empezados">Empezados</button><button class="sub-btn" data-status="pendientes">Pendientes</button><button class="sub-btn" data-status="bloqueo">Bloqueo</button></div><div class="container"><div class="card-form"><div class="upload-area" id="bookUpload"><div id="bookUploadText">📷 <b>Subir portada</b><br><span class="small">Toca para añadir</span></div><img id="bookPreview"></div><input type="file" id="bookFile" accept="image/*" hidden><label>Título</label><input class="input" id="bTitle" placeholder="Nombre del libro"><label>Autor</label><input class="input" id="bAuthor" placeholder="Autor"><div id="fields-leidos"><div class="row"><div><label>Páginas</label><input class="input" id="bPages" type="number" placeholder="300"></div><div><label>Calif</label><select class="input" id="bRating"><option>5 ⭐</option><option>4 ⭐</option><option>3 ⭐</option><option>2 ⭐</option><option>1 ⭐</option></select></div></div><div class="row"><div><label>Inicio</label><input class="input" id="bStart" type="date"></div><div><label>Fin</label><input class="input" id="bEnd" type="date"></div></div></div><div id="fields-empezados" class="hidden"><div class="row"><div><label>Total</label><input class="input" id="bTotalPages" type="number"></div><div><label>Actual</label><input class="input" id="bCurrentPage" type="number"></div></div><label>Fecha inicio</label><input class="input" id="bStart2" type="date"></div><div id="fields-pendientes" class="hidden"><label>Páginas</label><input class="input" id="bPagesPend" type="number"></div><div id="fields-bloqueo" class="hidden"><label>Páginas</label><input class="input" id="bPagesBloq" type="number"><label>¿Por qué?</label><input class="input" id="bReason"><label>¿Retomar?</label><select class="input" id="bResume"><option>Sí</option><option>No</option><option>Tal vez</option></select></div><button class="btn-primary" id="addBookBtn">+ Añadir a <span id="addBookLabel">Leídos</span></button></div><div id="bookList" class="grid"></div></div></div><div id="view-dramas" class="hidden"><div class="sub-tabs" id="dramaTabs"><button class="sub-btn active" data-status="vistos">Vistos</button><button class="sub-btn" data-status="pausados">Pausados</button><button class="sub-btn" data-status="pendientes">Pendientes</button><button class="sub-btn" data-status="abandonados">Abandonados</button></div><div class="container"><div class="card-form"><div class="upload-area" id="dramaUpload"><div id="dramaUploadText">📷 <b>Subir portada drama</b><br><span class="small">Toca</span></div><img id="dramaPreview"></div><input type="file" id="dramaFile" accept="image/*" hidden><label>Título</label><input class="input" id="dTitle" placeholder="Nombre drama"><label>Plataforma</label><input class="input" id="dPlatform" placeholder="Netflix, Viki..."><div id="d-fields-vistos"><div class="row"><div><label>Total caps</label><input class="input" id="dTotal" type="number"></div><div><label>Calif</label><select class="input" id="dRating"><option>5 ⭐</option><option>4 ⭐</option><option>3 ⭐</option><option>2 ⭐</option><option>1 ⭐</option></select></div></div><div class="row"><div><label>Inicio</label><input class="input" id="dStart" type="date"></div><div><label>Fin</label><input class="input" id="dEnd" type="date"></div></div></div><div id="d-fields-pausados" class="hidden"><div class="row"><div><label>Total</label><input class="input" id="dTotalP" type="number"></div><div><label>Actual</label><input class="input" id="dCurrent" type="number"></div></div><label>Inicio</label><input class="input" id="dStartP" type="date"></div><div id="d-fields-pendientes" class="hidden"><div class="row"><div><label>Total</label><input class="input" id="dTotalPen" type="number"></div><div><label>Dónde</label><input class="input" id="dWhere"></div></div></div><div id="d-fields-abandonados" class="hidden"><div class="row"><div><label>Total</label><input class="input" id="dTotalA" type="number"></div><div><label>Quedé</label><input class="input" id="dCurrentA" type="number"></div></div><label>¿Por qué?</label><input class="input" id="dReason"><label>¿Retomar?</label><select class="input" id="dResume"><option>No</option><option>Sí</option><option>Tal vez</option></select></div><button class="btn-primary" id="addDramaBtn">+ Añadir a <span id="addDramaLabel">Vistos</span></button></div><div id="dramaList" class="grid"></div></div></div><div id="view-estanteria" class="hidden"><div class="container" style="padding-top:10px"><div class="main-tabs" style="margin:8px 0 14px"><button class="tab-btn active" data-est="libros-leidos">📚 Leídos</button><button class="tab-btn" data-est="libros-empezados">📖 Empezados</button><button class="tab-btn" data-est="libros-pendientes">📋 Pendientes</button><button class="tab-btn" data-est="libros-bloqueo">🚫 Bloqueo</button></div><div class="main-tabs" style="margin:0 0 14px"><button class="tab-btn" data-est="dramas-vistos">🎬 Vistos</button><button class="tab-btn" data-est="dramas-pausados">⏸️ Pausados</button><button class="tab-btn" data-est="dramas-pendientes">🕒 Pendientes</button><button class="tab-btn" data-est="dramas-abandonados">💔 Abandonados</button></div><div id="shelfContainer"></div></div></div><div id="view-perfil" class="hidden"><div class="container" style="padding-top:16px"><div class="profile-card"><input type="file" id="avatarFile" accept="image/*" hidden><img id="avatarImg" class="avatar" onclick="document.getElementById('avatarFile').click()"><div class="small">Toca foto</div><input class="input" id="profileName" placeholder="Tu nombre" style="text-align:center;font-weight:800;margin-top:8px"><div class="stats"><div class="stat"><b id="statBooks">0</b><span class="small">Leídos</span></div><div class="stat"><b id="statDramas">0</b><span class="small">Vistos</span></div><div class="stat"><b id="statTotal">0</b><span class="small">Total</span></div></div><button class="btn-primary" id="saveProfile">Guardar perfil</button></div></div></div><div class="bottom-nav"><button class="nav-btn active" data-view="biblioteca">📚<br>Biblioteca</button><button class="nav-btn" data-view="dramas">🎬<br>Dramas</button><button class="nav-btn" data-view="estanteria">🗄️<br>Estantería</button><button class="nav-btn" data-view="perfil">👤<br>Perfil</button></div><div class="modal" id="detailModal"><div class="modal-box"><img id="mCover" class="modal-cover"><div class="modal-content"><div style="display:flex;justify-content:space-between"><div><h2 id="mTitle"></h2><p id="mSub" class="small"></p></div><span id="mNumber" class="badge" style="position:static"></span></div><div id="mDetails" style="margin-top:12px;display:grid;gap:8px"></div><div class="modal-actions"><button class="btn-danger" id="mDelete">🗑️ Borrar</button><button class="btn-move" id="mMove">Mover</button></div><button class="btn-primary" onclick="closeModal()" style="background:#e9e6ff;color:#2d2a4a">Cerrar</button></div></div></div><script>
let books=JSON.parse(localStorage.getItem('arbell_books_v2')||'[]'),dramas=JSON.parse(localStorage.getItem('arbell_dramas_v2')||'[]'),profile=JSON.parse(localStorage.getItem('arbell_profile_v2')||'{"name":"Arbell","avatar":""}'),currentBookStatus='leidos',currentDramaStatus='vistos',currentEst='libros-leidos',tempCoverBook='',tempCoverDrama='',selectedItem=null;
function save(){localStorage.setItem('arbell_books_v2',JSON.stringify(books));localStorage.setItem('arbell_dramas_v2',JSON.stringify(dramas));renderAll()}
function readFile(f,cb){if(!f)return;let r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f)}
function init(){
document.getElementById('profileName').value=profile.name;if(profile.avatar)document.getElementById('avatarImg').src=profile.avatar;
document.getElementById('bookUpload').onclick=()=>document.getElementById('bookFile').click();
document.getElementById('dramaUpload').onclick=()=>document.getElementById('dramaFile').click();
document.getElementById('bookFile').onchange=e=>readFile(e.target.files[0],d=>{tempCoverBook=d;document.getElementById('bookPreview').src=d;document.getElementById('bookUpload').classList.add('has-img');document.getElementById('bookUploadText').style.display='none'});
document.getElementById('dramaFile').onchange=e=>readFile(e.target.files[0],d=>{tempCoverDrama=d;document.getElementById('dramaPreview').src=d;document.getElementById('dramaUpload').classList.add('has-img');document.getElementById('dramaUploadText').style.display='none'});
document.getElementById('avatarFile').onchange=e=>readFile(e.target.files[0],d=>{profile.avatar=d;document.getElementById('avatarImg').src=d});
document.getElementById('addBookBtn').onclick=addBook;document.getElementById('addDramaBtn').onclick=addDrama;
document.getElementById('saveProfile').onclick=()=>{profile.name=document.getElementById('profileName').value||'Arbell';localStorage.setItem('arbell_profile_v2',JSON.stringify(profile));alert('Guardado 💙')};
document.querySelectorAll('#bookTabs.sub-btn').forEach(b=>{b.addEventListener('click',()=>{document.querySelectorAll('#bookTabs.sub-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentBookStatus=b.dataset.status;document.getElementById('addBookLabel').textContent=b.textContent;['leidos','empezados','pendientes','bloqueo'].forEach(s=>{let el=document.getElementById('fields-'+s);if(el)el.classList.toggle('hidden',s!==currentBookStatus)});renderBooks()})});
document.querySelectorAll('#dramaTabs.sub-btn').forEach(b=>{b.addEventListener('click',()=>{document.querySelectorAll('#dramaTabs.sub-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentDramaStatus=b.dataset.status;document.getElementById('addDramaLabel').textContent=b.textContent;['vistos','pausados','pendientes','abandonados'].forEach(s=>{let el=document.getElementById('d-fields-'+s);if(el)el.classList.toggle('hidden',s!==currentDramaStatus)});renderDramas()})});
document.querySelectorAll('.bottom-nav.nav-btn').forEach(b=>{b.addEventListener('click',()=>{document.querySelectorAll('.bottom-nav.nav-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('[id^=view-]').forEach(v=>v.classList.add('hidden'));let t=document.getElementById('view-'+b.dataset.view);if(t)t.classList.remove('hidden');if(b.dataset.view==='estanteria')renderShelf();if(b.dataset.view==='perfil')updateStats();window.scrollTo(0,0)})});
document.querySelectorAll('[data-est]').forEach(b=>{b.addEventListener('click',()=>{document.querySelectorAll('[data-est]').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentEst=b.dataset.est;renderShelf()})});
document.getElementById('detailModal').addEventListener('click',e=>{if(e.target.id==='detailModal')closeModal()});
document.getElementById('mDelete').onclick=deleteSelected;document.getElementById('mMove').onclick=moveSelected;renderAll()
}
function addBook(){let t=document.getElementById('bTitle').value.trim();if(!t)return alert('Pon título');let a=document.getElementById('bAuthor').value.trim()||'Sin autor';let o={id:Date.now(),number:books.length+1,title:t,author:a,cover:tempCoverBook||'',status:currentBookStatus,created:Date.now()};if(currentBookStatus==='leidos'){o.totalPages=document.getElementById('bPages').value||0;o.rating=document.getElementById('bRating').value;o.startDate=document.getElementById('bStart').value;o.endDate=document.getElementById('bEnd').value}if(currentBookStatus==='empezados'){o.totalPages=document.getElementById('bTotalPages').value||0;o.currentPage=document.getElementById('bCurrentPage').value||0;o.startDate=document.getElementById('bStart2').value}if(currentBookStatus==='pendientes'){o.totalPages=document.getElementById('bPagesPend').value||0}if(currentBookStatus==='bloqueo'){o.totalPages=document.getElementById('bPagesBloq').value||0;o.reason=document.getElementById('bReason').value;o.wouldResume=document.getElementById('bResume').value}books.push(o);save();['bTitle','bAuthor','bPages','bTotalPages','bCurrentPage','bPagesPend','bPagesBloq','bReason'].forEach(id=>{let el=document.getElementById(id);if(el)el.value=''});tempCoverBook='';document.getElementById('bookPreview').src='';document.getElementById('bookUpload').classList.remove('has-img');document.getElementById('bookUploadText').style.display='block'}
function addDrama(){let t=document.getElementById('dTitle').value.trim();if(!t)return alert('Pon título');let o={id:Date.now(),number:dramas.length+1,title:t,cover:tempCoverDrama||'',status:currentDramaStatus,platform:document.getElementById('dPlatform').value||'',created:Date.now()};if(currentDramaStatus==='vistos'){o.totalEp=document.getElementById('dTotal').value||0;o.rating=document.getElementById('dRating').value;o.startDate=document.getElementById('dStart').value;o.endDate=document.getElementById('dEnd').value}if(currentDramaStatus==='pausados'){o.totalEp=document.getElementById('dTotalP').value||0;o.currentEp=document.getElementById('dCurrent').value||0;o.startDate=document.getElementById('dStartP').value}if(currentDramaStatus==='pendientes'){o.totalEp=document.getElementById('dTotalPen').value||0;o.where=document.getElementById('dWhere').value||o.platform}if(currentDramaStatus==='abandonados'){o.totalEp=document.getElementById('dTotalA').value||0;o.currentEp=document.getElementById('dCurrentA').value||0;o.reason=document.getElementById('dReason').value;o.wouldResume=document.getElementById('dResume').value}dramas.push(o);save();['dTitle','dPlatform','dTotal','dTotalP','dCurrent','dTotalPen','dWhere','dTotalA','dCurrentA','dReason'].forEach(id=>{let el=document.getElementById(id);if(el)el.value=''});tempCoverDrama='';document.getElementById('dramaPreview').src='';document.getElementById('dramaUpload').classList.remove('has-img');document.getElementById('dramaUploadText').style.display='block'}
function renderAll(){renderBooks();renderDramas();updateStats()}
function renderBooks(){let list=document.getElementById('bookList');list.innerHTML='';let f=books.filter(b=>b.status===currentBookStatus).sort((a,b)=>b.created-a.created);f.forEach(b=>{let d=document.createElement('div');d.className='item-card';d.onclick=()=>openModal(b,'book');let p='';if(b.status==='empezados'&&b.totalPages){let pct=Math.min(100,Math.round((b.currentPage/b.totalPages)*100));p=`<div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div><div class="small">Pág ${b.currentPage}/${b.totalPages} • ${pct}%</div>`}d.innerHTML=`<span class="badge">#${b.number} • ${b.status}</span><img src="${b.cover||'https://via.placeholder.com/300x400/e9e6ff/6d5bff?text='+encodeURIComponent(b.title)}"><div class="item-info"><h4>${b.title}</h4><p>${b.author}</p>${p}</div>`;list.appendChild(d)});if(!f.length)list.innerHTML=`<div class="small" style="grid-column:1/-1;text-align:center;padding:20px;background:rgba(255,255,255,.7);border-radius:16px">No hay libros en ${currentBookStatus}</div>`}
function renderDramas(){let list=document.getElementById('dramaList');list.innerHTML='';let f=dramas.filter(d=>d.status===currentDramaStatus).sort((a,b)=>b.created-a.created);f.forEach(d=>{let div=document.createElement('div');div.className='item-card';div.onclick=()=>openModal(d,'drama');let p='';if(d.status==='pausados'&&d.totalEp){let pct=Math.min(100,Math.round((d.currentEp/d.totalEp)*100));p=`<div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div><div class="small">Ep ${d.currentEp}/${d.totalEp}</div>`}div.innerHTML=`<span class="badge">#${d.number} • ${d.status}</span><img src="${d.cover||'https://via.placeholder.com/300x400/e9e6ff/6d5bff?text='+encodeURIComponent(d.title)}"><div class="item-info"><h4>${d.title}</h4><p>${d.platform||d.where||''}</p>${p}</div>`;list.appendChild(div)});if(!f.length)list.innerHTML=`<div class="small" style="grid-column:1/-1;text-align:center;padding:20px;background:rgba(255,255,255,.7);border-radius:16px">No hay dramas en ${currentDramaStatus}</div>`}
function renderShelf(){let cont=document.getElementById('shelfContainer');cont.innerHTML='';let parts=currentEst.split('-'),type=parts[0],status=parts.slice(1).join('-'),items=type==='libros'?books.filter(b=>b.status===status):dramas.filter(d=>d.status===status);if(!items.length){cont.innerHTML='<div class="small" style="text-align:center;padding:30px;background:rgba(255,255,255,.7);border-radius:16px">Vacío aún</div>';return}if(type==='libros'){let groups={};items.forEach(it=>{let k=it.author||'Sin autor';(groups[k]=groups[k]||[]).push(it)});Object.keys(groups).sort().forEach(author=>{let h=document.createElement('div');h.className='shelf-title';h.textContent=`✨ ${author} • ${groups[author].length}`;cont.appendChild(h);let grid=document.createElement('div');grid.className='grid';groups[author].forEach(b=>{let div=document.createElement('div');div.className='item-card';div.onclick=()=>openModal(b,'book');div.innerHTML=`<span class="badge">#${b.number}</span><img src="${b.cover||'https://via.placeholder.com/300x400/e9e6ff/6d5bff?text='+encodeURIComponent(b.title)}"><div class="item-info"><h4>${b.title}</h4></div>`;grid.appendChild(div)});cont.appendChild(grid)})}else{let groups={};items.forEach(it=>{let k=it.platform||it.where||'Sin plataforma';(groups[k]=groups[k]||[]).push(it)});Object.keys(groups).sort().forEach(plat=>{let h=document.createElement('div');h.className='shelf-title';h.textContent=`📺 ${plat} • ${groups[plat].length}`;cont.appendChild(h);let grid=document.createElement('div');grid.className='grid';groups[plat].forEach(d=>{let div=document.createElement('div');div.className='item-card';div.onclick=()=>openModal(d,'drama');div.innerHTML=`<span class="badge">#${d.number}</span><img src="${d.cover||'https://via.placeholder.com/300x400/e9e6ff/6d5bff?text='+encodeURIComponent(d.title)}"><div class="item-info"><h4>${d.title}</h4></div>`;grid.appendChild(div)});cont.appendChild(grid)})}}
function updateStats(){document.getElementById('statBooks').textContent=books.filter(b=>b.status==='leidos').length;document.getElementById('statDramas').textContent=dramas.filter(d=>d.status==='vistos').length;document.getElementById('statTotal').textContent=books.filter(b=>b.status==='leidos').length+dramas.filter(d=>d.status==='vistos').length}
function openModal(item,type){selectedItem={...item,_type:type};document.getElementById('mCover').src=item.cover||`https://via.placeholder.com/500x700/e9e6ff/6d5bff?text=${encodeURIComponent(item.title)}`;document.getElementById('mTitle').textContent=item.title;document.getElementById('mSub').textContent=type==='book'?item.author:(item.platform||item.where||'');document.getElementById('mNumber').textContent=`#${item.number} • ${item.status}`;let html='';if(type==='book'){html+=`<div><b>Autor:</b> ${item.author}</div>`;if(item.totalPages)html+=`<div><b>Páginas:</b> ${item.currentPage?item.currentPage+' / '+item.totalPages:item.totalPages}</div>`;if(item.startDate)html+=`<div><b>Inicio:</b> ${item.startDate}</div>`;if(item.endDate)html+=`<div><b>Fin:</b> ${item.endDate}</div>`;if(item.rating)html+=`<div><b>Calif:</b> ${item.rating}</div>`;if(item.reason)html+=`<div><b>Motivo:</b> ${item.reason}</div>`;if(item.wouldResume)html+=`<div><b>¿Retomar?</b> ${item.wouldResume}</div>`}else{html+=`<div><b>Plataforma:</b> ${item.platform||item.where||''}</div>`;if(item.totalEp)html+=`<div><b>Caps:</b> ${item.currentEp?item.currentEp+' / '+item.totalEp:item.totalEp}</div>`;if(item.startDate)html+=`<div><b>Inicio:</b> ${item.startDate}</div>`;if(item.endDate)html+=`<div><b>Fin:</b> ${item.endDate}</div>`;if(item.rating)html+=`<div><b>Calif:</b> ${item.rating}</div>`;if(item.reason)html+=`<div><b>Motivo:</b> ${item.reason}</div>`;if(item.wouldResume)html+=`<div><b>¿Retomar?</b> ${item.wouldResume}</div>`}document.getElementById('mDetails').innerHTML=html;document.getElementById('detailModal').classList.add('show')}
function closeModal(){document.getElementById('detailModal').classList.remove('show')}
function deleteSelected(){if(!selectedItem)return;if(!confirm('¿Borrar?'))return;if(selectedItem._type==='book')books=books.filter(b=>b.id!==selectedItem.id);else dramas=dramas.filter(d=>d.id!==selectedItem.id);save();closeModal()}
function moveSelected(){if(!selectedItem)return;let ns=prompt(`Mover a:\nLibros: leidos, empezados, pendientes, bloqueo\nDramas: vistos, pausados, pendientes, abandonados\nActual:${selectedItem.status}`);if(!ns)return;let s=ns.toLowerCase().trim();if(selectedItem._type==='book'&&['leidos','empezados','pendientes','bloqueo'].includes(s)){books=books.map(b=>b.id===selectedItem.id?{...b,status:s}:b)}else if(selectedItem._type==='drama'&&['vistos','pausados','pendientes','abandonados'].includes(s)){dramas=dramas.map(d=>d.id===selectedItem.id?{...d,status:s}:d)}else{alert('No existe');return}save();closeModal()}
init();
</script></body></html>
