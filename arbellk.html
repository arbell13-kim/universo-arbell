<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Universo Arbell V4</title><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Nunito',sans-serif}body{background:linear-gradient(135deg,#a8c0ff 0%,#c2b6ff 25%,#e8d5ff 50%,#b8c6ff 75%,#a8c0ff 100%);min-height:100vh;padding-bottom:100px;color:#2d2a4a}header{background:rgba(255,255,255,.9);backdrop-filter:blur(12px);padding:18px;text-align:center;position:sticky;top:0;z-index:50}header h1{font-weight:800}.tabs{display:flex;gap:8px;overflow-x:auto;padding:8px 16px}.t-btn{white-space:nowrap;padding:8px 14px;border-radius:999px;border:1.5px solid rgba(45,42,74,.15);background:#fff8;font-weight:700;font-size:.85rem;cursor:pointer}.t-btn.active{background:#2d2a4a;color:#fff}.container{padding:0 14px}.card{background:rgba(255,255,255,.92);border-radius:22px;padding:16px;box-shadow:0 8px 24px rgba(139,115,255,.2);margin-bottom:16px}.up{border:2px dashed #a99bff;border-radius:16px;padding:16px;text-align:center;cursor:pointer}.up img{width:100%;max-height:200px;object-fit:cover;border-radius:12px;display:none}.up.has img{display:block}.inp{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid rgba(45,42,74,.12);background:rgba(255,255,255,.9);font-size:.95rem}.row{display:flex;gap:10px}.row>*{flex:1}label{font-size:.8rem;font-weight:700;opacity:.7;margin:10px 0 4px;display:block}.btn{width:100%;padding:13px;border-radius:14px;border:none;background:linear-gradient(135deg,#6d5bff,#9b8cff);color:#fff;font-weight:800;cursor:pointer;margin-top:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.icard{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 6px 18px rgba(45,42,74,.12);position:relative;cursor:pointer}.icard img{width:100%;height:160px;object-fit:cover;background:#e9e6ff}.info{padding:10px}.badge{position:absolute;top:8px;left:8px;background:#2d2a4a;color:#fff;font-size:.65rem;padding:4px 8px;border-radius:999px;font-weight:700}.pb{height:4px;background:rgba(0,0,0,.08);border-radius:999px;margin-top:6px;overflow:hidden}.pf{height:100%;background:#6d5bff}.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:end;justify-content:center}.modal.show{display:flex}.mbox{background:#fff;width:100%;max-width:500px;border-radius:28px 28px 0 0;max-height:88vh;overflow:auto}.mcov{width:100%;height:260px;object-fit:cover}.mcon{padding:18px}.bnav{position:fixed;bottom:12px;left:12px;right:12px;background:#fff;border-radius:24px;display:flex;justify-content:space-around;padding:8px;box-shadow:0 10px 30px rgba(45,42,74,.25);z-index:100;border:1px solid #eee}.nbtn{flex:1;padding:10px 4px;border:none;background:none;border-radius:16px;font-weight:800;font-size:.75rem;cursor:pointer;color:#6b6788}.nbtn.active{background:#2d2a4a;color:#fff}.hidden{display:none!important}.small{font-size:.8rem;opacity:.7}.sTitle{font-weight:800;margin:18px 0 10px;background:rgba(255,255,255,.85);display:inline-block;padding:6px 14px;border-radius:999px}</style></head><body>
<header><div>💙💜</div><h1>Universo Arbell</h1><p>Club Namjoon's • V4 Arreglada</p></header>
<div id="view-biblioteca">
<div class="tabs" id="bookTabs"><button class="t-btn active" data-s="leidos">Leídos</button><button class="t-btn" data-s="empezados">Empezados</button><button class="t-btn" data-s="pendientes">Pendientes</button><button class="t-btn" data-s="bloqueo">Bloqueo</button></div>
<div class="container"><div class="card"><div class="up" id="bookUp"><div id="bookUpT">📷 <b>Subir portada libro</b></div><img id="bookPrev"></div><input type="file" id="bookFile" accept="image/*" hidden><label>Título</label><input class="inp" id="bTitle" placeholder="Nombre del libro"><label>Autor</label><input class="inp" id="bAuthor" placeholder="Autor">
<div id="f-leidos"><div class="row"><div><label>Páginas</label><input class="inp" id="bPages" type="number"></div><div><label>Calif</label><select class="inp" id="bRating"><option>5 ⭐</option><option>4 ⭐</option><option>3 ⭐</option><option>2 ⭐</option><option>1 ⭐</option></select></div></div><div class="row"><div><label>Inicio</label><input class="inp" id="bStart" type="date"></div><div><label>Fin</label><input class="inp" id="bEnd" type="date"></div></div></div>
<div id="f-empezados" class="hidden"><div class="row"><div><label>Total</label><input class="inp" id="bTotal" type="number"></div><div><label>Actual</label><input class="inp" id="bCurr" type="number"></div></div><label>Inicio</label><input class="inp" id="bStart2" type="date"></div>
<div id="f-pendientes" class="hidden"><label>Páginas</label><input class="inp" id="bPagesP" type="number"></div>
<div id="f-bloqueo" class="hidden"><label>Páginas</label><input class="inp" id="bPagesB" type="number"><label>¿Por qué?</label><input class="inp" id="bReason"><label>¿Retomar?</label><select class="inp" id="bResume"><option>Sí</option><option>No</option><option>Tal vez</option></select></div>
<button class="btn" id="addBook">+ Añadir a <span id="addBookL">Leídos</span></button></div><div id="bookList" class="grid"></div></div></div>
<div id="view-dramas" class="hidden">
<div class="tabs" id="dramaTabs"><button class="t-btn active" data-s="vistos">Vistos</button><button class="t-btn" data-s="pausados">Pausados</button><button class="t-btn" data-s="pendientes">Pendientes</button><button class="t-btn" data-s="abandonados">Abandonados</button></div>
<div class="container"><div class="card"><div class="up" id="dramaUp"><div id="dramaUpT">📷 <b>Subir portada drama</b></div><img id="dramaPrev"></div><input type="file" id="dramaFile" accept="image/*" hidden><label>Título</label><input class="inp" id="dTitle" placeholder="Nombre drama"><label>Plataforma</label><input class="inp" id="dPlat" placeholder="Netflix, Viki..."><div id="d-vistos"><div class="row"><div><label>Total caps</label><input class="inp" id="dTotal" type="number"></div><div><label>Calif</label><select class="inp" id="dRating"><option>5 ⭐</option><option>4 ⭐</option><option>3 ⭐</option><option>2 ⭐</option><option>1 ⭐</option></select></div></div><div class="row"><div><label>Inicio</label><input class="inp" id="dStart" type="date"></div><div><label>Fin</label><input class="inp" id="dEnd" type="date"></div></div></div>
<div id="d-pausados" class="hidden"><div class="row"><div><label>Total</label><input class="inp" id="dTotalP" type="number"></div><div><label>Actual</label><input class="inp" id="dCurr" type="number"></div></div><label>Inicio</label><input class="inp" id="dStartP" type="date"></div>
<div id="d-pendientes" class="hidden"><div class="row"><div><label>Total</label><input class="inp" id="dTotalPe" type="number"></div><div><label>Dónde ver</label><input class="inp" id="dWhere"></div></div></div>
<div id="d-abandonados" class="hidden"><div class="row"><div><label>Total</label><input class="inp" id="dTotalA" type="number"></div><div><label>Quedé</label><input class="inp" id="dCurrA" type="number"></div></div><label>¿Por qué?</label><input class="inp" id="dReason"><label>¿Retomar?</label><select class="inp" id="dResume"><option>No</option><option>Sí</option><option>Tal vez</option></select></div>
<button class="btn" id="addDrama">+ Añadir a <span id="addDramaL">Vistos</span></button></div><div id="dramaList" class="grid"></div></div></div>
<div id="view-estanteria" class="hidden"><div class="container" style="padding-top:10px"><div class="tabs"><button class="t-btn active" data-e="libros-leidos">📚 Leídos</button><button class="t-btn" data-e="libros-empezados">📖 Empezados</button><button class="t-btn" data-e="libros-pendientes">📋 Pendientes</button><button class="t-btn" data-e="libros-bloqueo">🚫 Bloqueo</button></div><div class="tabs"><button class="t-btn" data-e="dramas-vistos">🎬 Vistos</button><button class="t-btn" data-e="dramas-pausados">⏸️ Pausados</button><button class="t-btn" data-e="dramas-pendientes">🕒 Pendientes</button><button class="t-btn" data-e="dramas-abandonados">💔 Abandonados</button></div><div id="shelf"></div></div></div>
<div id="view-perfil" class="hidden"><div class="container" style="padding-top:16px"><div class="card" style="text-align:center"><input type="file" id="avFile" accept="image/*" hidden><img id="avImg" style="width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,#a8c0ff,#c2b6ff);margin:0 auto 12px;display:block;border:3px solid #fff;cursor:pointer" onclick="document.getElementById('avFile').click()"><div class="small">Toca foto para cambiar</div><input class="inp" id="pName" placeholder="Tu nombre" style="text-align:center;font-weight:800;margin-top:8px"><div style="display:flex;gap:8px;margin-top:12px"><div style="flex:1;background:#eee8ff;padding:10px;border-radius:14px"><b id="sB">0</b><br><span class="small">Libros</span></div><div style="flex:1;background:#eee8ff;padding:10px;border-radius:14px"><b id="sD">0</b><br><span class="small">Dramas</span></div><div style="flex:1;background:#eee8ff;padding:10px;border-radius:14px"><b id="sT">0</b><br><span class="small">Total</span></div></div><button class="btn" id="saveP">Guardar</button></div></div></div>
<div class="bnav"><button class="nbtn active" data-v="biblioteca">📚<br>Biblioteca</button><button class="nbtn" data-v="dramas">🎬<br>Dramas</button><button class="nbtn" data-v="estanteria">🗄️<br>Estantería</button><button class="nbtn" data-v="perfil">👤<br>Perfil</button></div>
<div class="modal" id="modal"><div class="mbox"><img id="mCov" class="mcov"><div class="mcon"><h2 id="mTit"></h2><p id="mSub" class="small"></p><div id="mDet" style="margin-top:10px;display:grid;gap:6px"></div><div style="display:flex;gap:8px;margin-top:12px"><button style="flex:1;padding:12px;border-radius:12px;border:1.5px solid #ff6b8a;color:#ff3b6a;background:#fff0f3;font-weight:700" id="mDel">🗑️ Borrar</button><button style="flex:1;padding:12px;border-radius:12px;border:none;background:#2d2a4a;color:#fff;font-weight:700" id="mMov">Mover</button></div><button class="btn" style="background:#e9e6ff;color:#2d2a4a" onclick="closeM()">Cerrar</button></div></div></div>
<script>
let books=JSON.parse(localStorage.getItem('arbell_books_v2')||'[]');let dramas=JSON.parse(localStorage.getItem('arbell_dramas_v2')||'[]');let profile=JSON.parse(localStorage.getItem('arbell_profile_v2')||'{"name":"Arbell","avatar":""}');let cB='leidos',cD='vistos',cE='libros-leidos',tCB='',tCD='',sel=null;
function save(){localStorage.setItem('arbell_books_v2',JSON.stringify(books));localStorage.setItem('arbell_dramas_v2',JSON.stringify(dramas));renderAll()}
function rf(f,cb){if(!f)return;let r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f)}
function init(){
document.getElementById('pName').value=profile.name||'Arbell';if(profile.avatar)document.getElementById('avImg').src=profile.avatar;
document.getElementById('bookUp').onclick=()=>document.getElementById('bookFile').click();
document.getElementById('dramaUp').onclick=()=>document.getElementById('dramaFile').click();
document.getElementById('bookFile').onchange=e=>rf(e.target.files[0],d=>{tCB=d;let i=document.getElementById('bookPrev');i.src=d;i.style.display='block';document.getElementById('bookUp').classList.add('has')});
document.getElementById('dramaFile').onchange=e=>rf(e.target.files[0],d=>{tCD=d;let i=document.getElementById('dramaPrev');i.src=d;i.style.display='block';document.getElementById('dramaUp').classList.add('has')});
document.getElementById('avFile').onchange=e=>rf(e.target.files[0],d=>{profile.avatar=d;document.getElementById('avImg').src=d});
document.getElementById('addBook').onclick=addB;document.getElementById('addDrama').onclick=addD;
document.getElementById('saveP').onclick=()=>{profile.name=document.getElementById('pName').value||'Arbell';localStorage.setItem('arbell_profile_v2',JSON.stringify(profile));alert('Guardado 💙')};
document.querySelectorAll('#bookTabs.t-btn').forEach(b=>{b.addEventListener('click',function(){document.querySelectorAll('#bookTabs.t-btn').forEach(x=>x.classList.remove('active'));this.classList.add('active');cB=this.dataset.s;document.getElementById('addBookL').textContent=this.textContent;['leidos','empezados','pendientes','bloqueo'].forEach(s=>{let el=document.getElementById('f-'+s);if(el)el.classList.toggle('hidden',s!==cB)});renderBooks()})});
document.querySelectorAll('#dramaTabs.t-btn').forEach(b=>{b.addEventListener('click',function(){document.querySelectorAll('#dramaTabs.t-btn').forEach(x=>x.classList.remove('active'));this.classList.add('active');cD=this.dataset.s;document.getElementById('addDramaL').textContent=this.textContent;['vistos','pausados','pendientes','abandonados'].forEach(s=>{let el=document.getElementById('d-'+s);if(el)el.classList.toggle('hidden',s!==cD)});renderDramas()})});
document.querySelectorAll('.bnav.nbtn').forEach(b=>{b.addEventListener('click',function(){document.querySelectorAll('.bnav.nbtn').forEach(x=>x.classList.remove('active'));this.classList.add('active');document.querySelectorAll('[id^=view-]').forEach(v=>v.classList.add('hidden'));let t=document.getElementById('view-'+this.dataset.v);if(t)t.classList.remove('hidden');if(this.dataset.v==='estanteria')renderShelf();if(this.dataset.v==='perfil')upd();window.scrollTo(0,0)})});
document.querySelectorAll('[data-e]').forEach(b=>{b.addEventListener('click',function(){document.querySelectorAll('[data-e]').forEach(x=>x.classList.remove('active'));this.classList.add('active');cE=this.dataset.e;renderShelf()})});
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeM()});document.getElementById('mDel').onclick=delSel;document.getElementById('mMov').onclick=movSel;renderAll();console.log('V4 OK')}
function addB(){let t=document.getElementById('bTitle').value.trim();if(!t)return alert('Título');let a=document.getElementById('bAuthor').value.trim()||'Sin autor';let o={id:Date.now(),number:books.length+1,title:t,author:a,cover:tCB||'',status:cB,created:Date.now()};if(cB==='leidos'){o.total=document.getElementById('bPages').value||0;o.rating=document.getElementById('bRating').value;o.s=document.getElementById('bStart').value;o.e=document.getElementById('bEnd').value}if(cB==='empezados'){o.total=document.getElementById('bTotal').value||0;o.curr=document.getElementById('bCurr').value||0;o.s=document.getElementById('bStart2').value}if(cB==='pendientes'){o.total=document.getElementById('bPagesP').value||0}if(cB==='bloqueo'){o.total=document.getElementById('bPagesB').value||0;o.reason=document.getElementById('bReason').value;o.res=document.getElementById('bResume').value}books.push(o);save();document.getElementById('bTitle').value='';document.getElementById('bAuthor').value='';tCB='';document.getElementById('bookPrev').style.display='none';document.getElementById('bookUp').classList.remove('has')}
function addD(){let t=document.getElementById('dTitle').value.trim();if(!t)return alert('Título');let o={id:Date.now(),number:dramas.length+1,title:t,cover:tCD||'',status:cD,platform:document.getElementById('dPlat').value||'',created:Date.now()};if(cD==='vistos'){o.total=document.getElementById('dTotal').value||0;o.rating=document.getElementById('dRating').value;o.s=document.getElementById('dStart').value;o.e=document.getElementById('dEnd').value}if(cD==='pausados'){o.total=document.getElementById('dTotalP').value||0;o.curr=document.getElementById('dCurr').value||0;o.s=document.getElementById('dStartP').value}if(cD==='pendientes'){o.total=document.getElementById('dTotalPe').value||0;o.where=document.getElementById('dWhere').value}if(cD==='abandonados'){o.total=document.getElementById('dTotalA').value||0;o.curr=document.getElementById('dCurrA').value||0;o.reason=document.getElementById('dReason').value;o.res=document.getElementById('dResume').value}dramas.push(o);save();document.getElementById('dTitle').value='';tCD='';document.getElementById('dramaPrev').style.display='none';document.getElementById('dramaUp').classList.remove('has')}
function renderAll(){renderBooks();renderDramas();upd()}
function renderBooks(){let L=document.getElementById('bookList');L.innerHTML='';let f=books.filter(b=>b.status===cB).sort((a,b)=>b.created-a.created);f.forEach(b=>{let d=document.createElement('div');d.className='icard';d.onclick=()=>openM(b,'book');let pr='';if(b.status==='empezados'&&b.total){let p=Math.min(100,Math.round((b.curr/b.total)*100));pr=`<div class="pb"><div class="pf" style="width:${p}%"></div></div><div class="small">${b.curr}/${b.total} • ${p}%</div>`}d.innerHTML=`<span class="badge">#${b.number}</span><img src="${b.cover||'https://via.placeholder.com/300x400/e9e6ff/6d5bff?text='+encodeURIComponent(b.title)}"><div class="info"><h4>${b.title}</h4><p>${b.author}</p>${pr}</div>`;L.appendChild(d)});if(!f.length)L.innerHTML=`<div class="small" style="grid-column:1/-1;text-align:center;padding:20px;background:#fff8;border-radius:16px">Vacío en ${cB}</div>`}
function renderDramas(){let L=document.getElementById('dramaList');L.innerHTML='';let f=dramas.filter(d=>d.status===cD).sort((a,b)=>b.created-a.created);f.forEach(d=>{let dv=document.createElement('div');dv.className='icard';dv.onclick=()=>openM(d,'drama');let pr='';if(d.status==='pausados'&&d.total){let p=Math.min(100,Math.round((d.curr/d.total)*100));pr=`<div class="pb"><div class="pf" style="width:${p}%"></div></div><div class="small">Ep ${d.curr}/${d.total}</div>`}dv.innerHTML=`<span class="badge">#${d.number}</span><img src="${d.cover||'https://via.placeholder.com/300x400/e9e6ff/6d5bff?text='+encodeURIComponent(d.title)}"><div class="info"><h4>${d.title}</h4><p>${d.platform||d.where||''}</p>${pr}</div>`;L.appendChild(dv)});if(!f.length)L.innerHTML=`<div class="small" style="grid-column:1/-1;text-align:center;padding:20px;background:#fff8;border-radius:16px">Vacío en ${cD}</div>`}
function renderShelf(){let C=document.getElementById('shelf');C.innerHTML='';let p=cE.split('-'),type=p[0],st=p.slice(1).join('-'),items=type==='libros'?books.filter(b=>b.status===st):dramas.filter(d=>d.status===st);if(!items.length){C.innerHTML='<div class="small" style="text-align:center;padding:30px;background:#fff8;border-radius:16px">Vacío</div>';return}let groups={};items.forEach(it=>{let k=type==='libros'?(it.author||'Sin autor'):(it.platform||it.where||'Sin plataforma');(groups[k]=groups[k]||[]).push(it)});Object.keys(groups).sort().forEach(k=>{let h=document.createElement('div');h.className='sTitle';h.textContent=`${type==='libros'?'✨':'📺'} ${k} • ${groups[k].length}`;C.appendChild(h);let g=document.createElement('div');g.className='grid';groups[k].forEach(it=>{let d=document.createElement('div');d.className='icard';d.onclick=()=>openM(it,type==='libros'?'book':'drama');d.innerHTML=`<span class="badge">#${it.number}</span><img src="${it.cover||'https://via.placeholder.com/300x400/e9e6ff/6d5bff?text='+encodeURIComponent(it.title)}"><div class="info"><h4>${it.title}</h4></div>`;g.appendChild(d)});C.appendChild(g)})}
function upd(){document.getElementById('sB').textContent=books.filter(b=>b.status==='leidos').length;document.getElementById('sD').textContent=dramas.filter(d=>d.status==='vistos').length;document.getElementById('sT').textContent=books.filter(b=>b.status==='leidos').length+dramas.filter(d=>d.status==='vistos').length}
function openM(it,type){sel={...it,_t:type};document.getElementById('mCov').src=it.cover||`https://via.placeholder.com/500x700/e9e6ff/6d5bff?text=${encodeURIComponent(it.title)}`;document.getElementById('mTit').textContent=it.title;document.getElementById('mSub').textContent=type==='book'?it.author:(it.platform||it.where||'');let h='';if(type==='book'){if(it.total)h+=`<div><b>Páginas:</b> ${it.curr?it.curr+'/'+it.total:it.total}</div>`;if(it.s)h+=`<div><b>Inicio:</b> ${it.s}</div>`;if(it.e)h+=`<div><b>Fin:</b> ${it.e}</div>`;if(it.rating)h+=`<div><b>Rating:</b> ${it.rating}</div>`;if(it.reason)h+=`<div><b>Motivo:</b> ${it.reason}</div>`}else{if(it.total)h+=`<div><b>Caps:</b> ${it.curr?it.curr+'/'+it.total:it.total}</div>`;if(it.platform)h+=`<div><b>Plataforma:</b> ${it.platform}</div>`;if(it.s)h+=`<div><b>Inicio:</b> ${it.s}</div>`;if(it.e)h+=`<div><b>Fin:</b> ${it.e}</div>`;if(it.rating)h+=`<div><b>Rating:</b> ${it.rating}</div>`;if(it.reason)h+=`<div><b>Motivo:</b> ${it.reason}</div>`}document.getElementById('mDet').innerHTML=h;document.getElementById('modal').classList.add('show')}
function closeM(){document.getElementById('modal').classList.remove('show')}
function delSel(){if(!sel)return;if(!confirm('¿Borrar?'))return;if(sel._t==='book')books=books.filter(b=>b.id!==sel.id);else dramas=dramas.filter(d=>d.id!==sel.id);save();closeM()}
function movSel(){if(!sel)return;let ns=prompt(`Mover a:\nLibros: leidos, empezados, pendientes, bloqueo\nDramas: vistos, pausados, pendientes, abandonados\nActual: ${sel.status}`);if(!ns)return;let s=ns.toLowerCase().trim();if(sel._t==='book'&&['leidos','empezados','pendientes','bloqueo'].includes(s)){books=books.map(b=>b.id===sel.id?{...b,status:s}:b)}else if(sel._t==='drama'&&['vistos','pausados','pendientes','abandonados'].includes(s)){dramas=dramas.map(d=>d.id===sel.id?{...d,status:s}:d)}else{alert('No existe');return}save();closeM()}
init();
</script></body></html>
